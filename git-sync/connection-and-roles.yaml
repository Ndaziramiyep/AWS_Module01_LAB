# ============================================================================
# git-sync/connection-and-roles.yaml
#
# What:   One-time bootstrap for CloudFormation Git sync: the GitHub
#         connection, the role Git sync assumes, and the service role the
#         onboarding stack (templates/onboarding.yaml) deploys with.
# Deploy: Once per account, by an admin, in eu-west-1:
#           aws cloudformation deploy --region eu-west-1 \
#             --template-file git-sync/connection-and-roles.yaml \
#             --stack-name onward-gitsync-bootstrap \
#             --capabilities CAPABILITY_NAMED_IAM
#         Then approve the connection once in Developer Tools > Settings >
#         Connections (AWS requires a person to do this).
# Next:   Create the Git sync stack from onboarding-deployment.yaml using the
#         two role ARNs in Outputs.
# Proof:  verify-access.sh section 8 checks the live stack against these
#         Outputs.
# ============================================================================
AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  One-time bootstrap for Git sync: the Git connection, the role Git sync uses
  to drive CloudFormation, and the service role the onboarding stack
  (templates/onboarding.yaml) deploys with. Deploy as stack
  onward-gitsync-bootstrap from git-sync/connection-and-roles.yaml.

Parameters:
  # Where the repository is hosted.
  ProviderType:
    Type: String
    Default: GitHub
    AllowedValues: [GitHub, GitLab, Bitbucket, GitHubEnterpriseServer]
    Description: Git provider hosting this repository.

Resources:

  # Link between AWS and the Git repository. Starts PENDING until approved
  # once in the console; verify-access.sh expects AVAILABLE.
  RepoConnection:
    Type: AWS::CodeConnections::Connection
    Properties:
      ConnectionName: onward-onboarding-repo
      ProviderType: !Ref ProviderType

  # ---- Role Git sync assumes to create/execute change sets ------------------

  # What Git sync may do: run change sets on the stack, manage its own
  # EventBridge rules, and hand StackDeployRole to CloudFormation.
  GitSyncPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: onward-gitsync-sync-policy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DriveStack
            Effect: Allow
            Action:
              - cloudformation:CreateChangeSet
              - cloudformation:DeleteChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStacks
              - cloudformation:ExecuteChangeSet
              - cloudformation:GetTemplate
              - cloudformation:ListChangeSets
              - cloudformation:ListStacks
              - cloudformation:ValidateTemplate
            Resource: '*'
          - Sid: ManagedEventRules
            Effect: Allow
            Action: [events:PutRule, events:PutTargets]
            Resource: '*'
            Condition:
              StringEquals:
                events:ManagedBy: cloudformation.sync.codeconnections.amazonaws.com
          # Part of the role policy AWS documents for Git sync.
          - Sid: DescribeEventRules
            Effect: Allow
            Action: events:DescribeRule
            Resource: '*'
          - Sid: PassStackRole
            Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt StackDeployRole.Arn

  # Identity Git sync runs as. Only the Git sync service can assume it.
  GitSyncRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: onward-gitsync-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudformation.sync.codeconnections.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns: [!Ref GitSyncPolicy]

  # ---- Service role CloudFormation uses to build the onboarding resources --

  # What the onboarding stack may build. Must cover every service used in
  # templates/onboarding.yaml: IAM, Secrets Manager, S3 and CloudTrail.
  StackDeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: onward-onboarding-stack-deploy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: BuildOnboardingResources
            Effect: Allow
            Action:
              - 'iam:*'
              - 'secretsmanager:*'
              - 's3:*'
              - 'cloudtrail:*'
            Resource: '*'

  # Identity CloudFormation uses for the onboarding stack, so people need no
  # standing rights to change IAM. Only CloudFormation can assume it.
  StackDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: onward-onboarding-stack-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudformation.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns: [!Ref StackDeployPolicy]

# ============================================================================
# OUTPUTS - pick the two role ARNs when creating the Git sync stack.
# verify-access.sh section 8 reads all three to prove the wiring.
# ============================================================================
Outputs:
  ConnectionArn:
    Description: Git connection; approve once in Developer Tools > Settings > Connections.
    Value: !Ref RepoConnection
  GitSyncRoleArn:
    Description: Choose as the Git sync role when creating the stack.
    Value: !GetAtt GitSyncRole.Arn
  StackDeployRoleArn:
    Description: Choose as the stack's service role (IAM role for stack deployments).
    Value: !GetAtt StackDeployRole.Arn

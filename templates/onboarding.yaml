AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Onward Logistics - repeatable, auditable engineer onboarding.
  Groups carry AWS managed job policies, permission boundaries cap every
  engineer, Secrets Manager generates first-login passwords, CloudTrail
  records every access change, outside parties get temporary role access
  only, and a budget makes spend visible from day one. No inline IAM policies.

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedPattern: '[a-z0-9-]+'
  CreateAuditTrail:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: Set to false if the account already has an org/account trail.
  BudgetAlertEmail:
    Type: String
    AllowedPattern: '[^@\s]+@[^@\s]+\.[^@\s]+'
    Description: Who is emailed when spend approaches the monthly budget.
  MonthlyBudgetUsd:
    Type: Number
    Default: 20
    MinValue: 1
    Description: Monthly cost ceiling for this account, in USD.
  ExternalAuditorAccountId:
    Type: String
    Default: ''
    AllowedPattern: '(\d{12})?'
    Description: >-
      AWS account of the outside party (e.g. external auditor). Leave empty to
      trust this account, so the role can be demonstrated without a partner.
  ExternalAuditorExternalId:
    Type: String
    MinLength: 8
    Default: onward-prod-external-audit
    Description: >-
      External ID the outside party must present (confused-deputy protection).
      AWS treats this as an identifier, not a secret.

Conditions:
  MakeTrail: !Equals [!Ref CreateAuditTrail, 'true']
  HasExternalAccount: !Not [!Equals [!Ref ExternalAuditorAccountId, '']]

Resources:

  # ==========================================================================
  # 1. PERMISSION BOUNDARIES - the ceilings. Whatever is attached to a user
  #    or their group later, effective access = (identity policies) AND
  #    (boundary). Anything outside the boundary can never be granted.
  # ==========================================================================

  StorageBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub onward-${Environment}-boundary-storage
      Description: Maximum permissions a storage engineer can ever hold.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: StorageWork
            Effect: Allow
            Action: 's3:*'
            Resource: '*'
          - Sid: SelfServicePassword
            Effect: Allow
            Action: [iam:ChangePassword, iam:GetUser]
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:user/${!aws:username}'
          - Sid: ReadPasswordPolicy
            Effect: Allow
            Action: iam:GetAccountPasswordPolicy
            Resource: '*'
          # s3:* above would otherwise include the audit log bucket. Storage
          # engineers must never be able to edit or delete audit evidence.
          - !If
            - MakeTrail
            - Sid: NeverTouchAuditEvidence
              Effect: Deny
              Action: 's3:*'
              Resource:
                - !GetAtt AuditBucket.Arn
                - !Sub '${AuditBucket.Arn}/*'
            - !Ref AWS::NoValue

  ComputeBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub onward-${Environment}-boundary-compute
      Description: Maximum permissions a compute engineer can ever hold.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ComputeWork
            Effect: Allow
            Action:
              - 'ec2:*'
              - 'elasticloadbalancing:*'
              - 'autoscaling:*'
              - 'cloudwatch:Describe*'
              - 'cloudwatch:Get*'
              - 'cloudwatch:List*'
            Resource: '*'
          - Sid: SelfServicePassword
            Effect: Allow
            Action: [iam:ChangePassword, iam:GetUser]
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:user/${!aws:username}'
          - Sid: ReadPasswordPolicy
            Effect: Allow
            Action: iam:GetAccountPasswordPolicy
            Resource: '*'

  ObserverBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub onward-${Environment}-boundary-compute-observer
      Description: >-
        Hard ceiling for on-call engineers. Read-only compute visibility only;
        creating, starting or terminating compute is explicitly denied.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ObserveCompute
            Effect: Allow
            Action:
              - 'ec2:Describe*'
              - 'ec2:Get*'
              - 'elasticloadbalancing:Describe*'
              - 'autoscaling:Describe*'
              - 'cloudwatch:Describe*'
              - 'cloudwatch:Get*'
              - 'cloudwatch:List*'
            Resource: '*'
          - Sid: SelfServicePassword
            Effect: Allow
            Action: [iam:ChangePassword, iam:GetUser]
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:user/${!aws:username}'
          - Sid: ReadPasswordPolicy
            Effect: Allow
            Action: iam:GetAccountPasswordPolicy
            Resource: '*'
          # Belt and braces: the allow-list above already blocks these, the
          # explicit deny documents intent and survives future boundary edits.
          - Sid: NeverCreateOrTerminateCompute
            Effect: Deny
            Action:
              - ec2:RunInstances
              - ec2:StartInstances
              - ec2:TerminateInstances
              - ec2:CreateFleet
              - ec2:RequestSpotInstances
              - ec2:RequestSpotFleet
              - autoscaling:CreateAutoScalingGroup
              - autoscaling:UpdateAutoScalingGroup
              - autoscaling:SetDesiredCapacity
            Resource: '*'
          - Sid: NeverTouchOwnBoundary
            Effect: Deny
            Action:
              - iam:DeleteUserPermissionsBoundary
              - iam:PutUserPermissionsBoundary
            Resource: '*'

  # ==========================================================================
  # 2. GROUPS - job functions, built from AWS managed policies only.
  # ==========================================================================

  StorageEngineersGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: !Sub onward-${Environment}-storage-engineers
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonS3FullAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/IAMUserChangePassword

  ComputeEngineersGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: !Sub onward-${Environment}-compute-engineers
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonEC2FullAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/IAMUserChangePassword

  OnCallObserversGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: !Sub onward-${Environment}-oncall-observers
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonEC2ReadOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/IAMUserChangePassword

  # ==========================================================================
  # 3. INITIAL CREDENTIALS - generated by Secrets Manager, never typed or
  #    stored in Git. Delivered to the hire out-of-band by an admin.
  # ==========================================================================

  S3UserInitialPassword:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub onward/${Environment}/onboarding/s3-user
      Description: First-login password for s3-user (forced reset on sign-in)
      GenerateSecretString:
        SecretStringTemplate: '{"username":"s3-user"}'
        GenerateStringKey: password
        PasswordLength: 20
        RequireEachIncludedType: true
        ExcludeCharacters: '"@/\''`'

  Ec2User1InitialPassword:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub onward/${Environment}/onboarding/ec2-user-1
      Description: First-login password for ec2-user-1 (forced reset on sign-in)
      GenerateSecretString:
        SecretStringTemplate: '{"username":"ec2-user-1"}'
        GenerateStringKey: password
        PasswordLength: 20
        RequireEachIncludedType: true
        ExcludeCharacters: '"@/\''`'

  Ec2User2InitialPassword:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub onward/${Environment}/onboarding/ec2-user-2
      Description: First-login password for ec2-user-2 (forced reset on sign-in)
      GenerateSecretString:
        SecretStringTemplate: '{"username":"ec2-user-2"}'
        GenerateStringKey: password
        PasswordLength: 20
        RequireEachIncludedType: true
        ExcludeCharacters: '"@/\''`'

  # ==========================================================================
  # 4. USERS - group membership + boundary + forced password reset.
  # ==========================================================================

  S3User:
    Type: AWS::IAM::User
    Properties:
      UserName: s3-user
      Groups: [!Ref StorageEngineersGroup]
      PermissionsBoundary: !Ref StorageBoundary
      LoginProfile:
        Password: !Sub '{{resolve:secretsmanager:${S3UserInitialPassword}:SecretString:password}}'
        PasswordResetRequired: true
      Tags:
        - {Key: Role, Value: storage-engineer}

  Ec2User1:
    Type: AWS::IAM::User
    Properties:
      UserName: ec2-user-1
      Groups: [!Ref ComputeEngineersGroup]
      PermissionsBoundary: !Ref ComputeBoundary
      LoginProfile:
        Password: !Sub '{{resolve:secretsmanager:${Ec2User1InitialPassword}:SecretString:password}}'
        PasswordResetRequired: true
      Tags:
        - {Key: Role, Value: compute-engineer}

  Ec2User2:
    Type: AWS::IAM::User
    Properties:
      UserName: ec2-user-2
      Groups: [!Ref OnCallObserversGroup]
      PermissionsBoundary: !Ref ObserverBoundary
      LoginProfile:
        Password: !Sub '{{resolve:secretsmanager:${Ec2User2InitialPassword}:SecretString:password}}'
        PasswordResetRequired: true
      Tags:
        - {Key: Role, Value: oncall-observer}

  # ==========================================================================
  # 5. AUDIT TRAIL - who changed access, and when. IAM is a global service,
  #    so global service events must be included.
  # ==========================================================================

  AuditBucket:
    Type: AWS::S3::Bucket
    Condition: MakeTrail
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration: {Status: Enabled}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  # Resource-based policy (required by CloudTrail), not an IAM inline policy.
  AuditBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: MakeTrail
    Properties:
      Bucket: !Ref AuditBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudTrailAclCheck
            Effect: Allow
            Principal: {Service: cloudtrail.amazonaws.com}
            Action: s3:GetBucketAcl
            Resource: !GetAtt AuditBucket.Arn
            Condition:
              StringEquals:
                aws:SourceArn: !Sub arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/onward-${Environment}-access-audit
          - Sid: CloudTrailWrite
            Effect: Allow
            Principal: {Service: cloudtrail.amazonaws.com}
            Action: s3:PutObject
            Resource: !Sub '${AuditBucket.Arn}/AWSLogs/${AWS::AccountId}/*'
            Condition:
              StringEquals:
                aws:SourceArn: !Sub arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/onward-${Environment}-access-audit
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt AuditBucket.Arn
              - !Sub '${AuditBucket.Arn}/*'
            Condition:
              Bool: {aws:SecureTransport: 'false'}

  AuditTrail:
    Type: AWS::CloudTrail::Trail
    Condition: MakeTrail
    DependsOn: AuditBucketPolicy
    Properties:
      TrailName: !Sub onward-${Environment}-access-audit
      S3BucketName: !Ref AuditBucket
      IsLogging: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true

  # ==========================================================================
  # 6. OUTSIDE PARTIES - temporary, limited access only. No IAM user, no
  #    password, no access key: they assume a role and get credentials that
  #    expire after one hour. The boundary keeps the role read-only even if
  #    someone attaches a broader policy to it later.
  # ==========================================================================

  ExternalAuditorBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub onward-${Environment}-boundary-external-auditor
      Description: Ceiling for outside parties - read configuration and audit history, never data.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReviewConfigurationAndHistory
            Effect: Allow
            Action:
              - 'cloudtrail:Describe*'
              - 'cloudtrail:Get*'
              - 'cloudtrail:List*'
              - cloudtrail:LookupEvents
              - 'iam:Get*'
              - 'iam:List*'
              - iam:GenerateCredentialReport
              - 'ec2:Describe*'
              - 'cloudformation:Describe*'
              - 'cloudformation:List*'
              - cloudformation:GetTemplate
              - 's3:GetBucket*'
              - s3:ListAllMyBuckets
            Resource: '*'
          - Sid: NeverReadDataOrSecrets
            Effect: Deny
            Action:
              - 's3:GetObject*'
              - secretsmanager:GetSecretValue
            Resource: '*'

  ExternalAuditorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub onward-${Environment}-external-auditor
      Description: Temporary, read-only access for people outside Onward Logistics.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !If
                - HasExternalAccount
                - !Sub 'arn:${AWS::Partition}:iam::${ExternalAuditorAccountId}:root'
                - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalAuditorExternalId
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/SecurityAudit
      PermissionsBoundary: !Ref ExternalAuditorBoundary
      Tags:
        - {Key: Role, Value: external-auditor}

  # ==========================================================================
  # 7. COST VISIBILITY - spend is visible from day one; the owner is emailed
  #    before the month's budget is used up, not after.
  # ==========================================================================

  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub onward-${Environment}-monthly-cost
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - {SubscriptionType: EMAIL, Address: !Ref BudgetAlertEmail}
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - {SubscriptionType: EMAIL, Address: !Ref BudgetAlertEmail}

# verify-access.sh reads these outputs instead of guessing names, so renaming
# a resource here keeps the evidence script pointed at the right thing.
Outputs:
  Environment:
    Value: !Ref Environment
  ConsoleSignInUrl:
    Value: !Sub https://${AWS::AccountId}.signin.aws.amazon.com/console

  # ---- Users and groups ----------------------------------------------------
  S3UserName:
    Value: !Ref S3User
  Ec2User1Name:
    Value: !Ref Ec2User1
  Ec2User2Name:
    Value: !Ref Ec2User2
  StorageEngineersGroupName:
    Value: !Ref StorageEngineersGroup
  ComputeEngineersGroupName:
    Value: !Ref ComputeEngineersGroup
  OnCallObserversGroupName:
    Value: !Ref OnCallObserversGroup

  # ---- Boundaries ----------------------------------------------------------
  StorageBoundaryArn:
    Value: !Ref StorageBoundary
  ComputeBoundaryArn:
    Value: !Ref ComputeBoundary
  ObserverBoundaryArn:
    Value: !Ref ObserverBoundary
  ExternalAuditorBoundaryArn:
    Value: !Ref ExternalAuditorBoundary

  # ---- First-login secrets (ARNs only, never values) -----------------------
  S3UserSecretArn:
    Value: !Ref S3UserInitialPassword
  Ec2User1SecretArn:
    Value: !Ref Ec2User1InitialPassword
  Ec2User2SecretArn:
    Value: !Ref Ec2User2InitialPassword

  # ---- Outside parties, audit, cost ----------------------------------------
  ExternalAuditorRoleName:
    Value: !Ref ExternalAuditorRole
  ExternalAuditorRoleArn:
    Value: !GetAtt ExternalAuditorRole.Arn
  MonthlyBudgetName:
    Value: !Ref MonthlyCostBudget
  AuditTrailName:
    Condition: MakeTrail
    Value: !Ref AuditTrail
  AuditBucketName:
    Condition: MakeTrail
    Value: !Ref AuditBucket

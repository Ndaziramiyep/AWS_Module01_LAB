# ============================================================================
# templates/onboarding.yaml
#
# What:   Every engineer onboarded at Onward Logistics: permission boundaries,
#         job-function groups, generated first-login passwords, IAM users and
#         the CloudTrail audit trail. No inline IAM policies.
# Deploy: Never by hand. CloudFormation Git sync reads onboarding-deployment.yaml
#         (repo root), which points here, and deploys with the service role
#         onward-onboarding-stack-role from git-sync/connection-and-roles.yaml.
# Region: eu-west-1
# Proof:  verify-access.sh reads the Outputs at the bottom of this file;
#         results go in evidence/Evidence-Report-Template.md.
# ============================================================================
AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Onward Logistics - repeatable, auditable engineer onboarding.
  Groups carry AWS managed job policies, permission boundaries cap every
  engineer, Secrets Manager generates first-login passwords, CloudTrail
  records every access change. No inline IAM policies.
  Deployed by Git sync from onboarding-deployment.yaml.

Parameters:
  # Prefix for every name (onward-<Environment>-...). Set in onboarding-deployment.yaml.
  Environment:
    Type: String
    Default: prod
    AllowedPattern: '[a-z0-9-]+'
    Description: Environment name used in every resource name, e.g. prod.
  # Lets the stack reuse an existing organisation/account trail instead.
  CreateAuditTrail:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: Set to false if the account already has an org/account trail.

Conditions:
  # True when this stack should create its own audit bucket and trail.
  MakeTrail: !Equals [!Ref CreateAuditTrail, 'true']

Resources:

  # ==========================================================================
  # 1. PERMISSION BOUNDARIES - the ceilings. Whatever is attached to a user
  #    or their group later, effective access = (identity policies) AND
  #    (boundary). Anything outside the boundary can never be granted.
  # ==========================================================================

  # Ceiling for storage engineers (s3-user): S3 plus own-password self-service.
  StorageBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub onward-${Environment}-boundary-storage
      Description: Maximum permissions a storage engineer can ever hold.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: StorageWork
            Effect: Allow
            Action: 's3:*'
            Resource: '*'
          - Sid: SelfServicePassword
            Effect: Allow
            Action: [iam:ChangePassword, iam:GetUser]
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:user/${!aws:username}'
          - Sid: ReadPasswordPolicy
            Effect: Allow
            Action: iam:GetAccountPasswordPolicy
            Resource: '*'

  # Ceiling for compute engineers (ec2-user-1): EC2, load balancers, Auto
  # Scaling and read-only CloudWatch, plus own-password self-service.
  ComputeBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub onward-${Environment}-boundary-compute
      Description: Maximum permissions a compute engineer can ever hold.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ComputeWork
            Effect: Allow
            Action:
              - 'ec2:*'
              - 'elasticloadbalancing:*'
              - 'autoscaling:*'
              - 'cloudwatch:Describe*'
              - 'cloudwatch:Get*'
              - 'cloudwatch:List*'
            Resource: '*'
          - Sid: SelfServicePassword
            Effect: Allow
            Action: [iam:ChangePassword, iam:GetUser]
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:user/${!aws:username}'
          - Sid: ReadPasswordPolicy
            Effect: Allow
            Action: iam:GetAccountPasswordPolicy
            Resource: '*'

  # Ceiling for on-call engineers (ec2-user-2): look, never change. Holds even
  # if AdministratorAccess is attached later (verify-access.sh section 2).
  ObserverBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub onward-${Environment}-boundary-compute-observer
      Description: >-
        Hard ceiling for on-call engineers. Read-only compute visibility;
        creating, starting or terminating compute is explicitly denied.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ObserveCompute
            Effect: Allow
            Action:
              - 'ec2:Describe*'
              - 'ec2:Get*'
              - 'elasticloadbalancing:Describe*'
              - 'autoscaling:Describe*'
              - 'cloudwatch:Describe*'
              - 'cloudwatch:Get*'
              - 'cloudwatch:List*'
            Resource: '*'
          - Sid: SelfServicePassword
            Effect: Allow
            Action: [iam:ChangePassword, iam:GetUser]
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:user/${!aws:username}'
          - Sid: ReadPasswordPolicy
            Effect: Allow
            Action: iam:GetAccountPasswordPolicy
            Resource: '*'
          # Belt and braces: the allow-list above already blocks these, the
          # explicit deny documents intent and survives future boundary edits.
          - Sid: NeverCreateOrTerminateCompute
            Effect: Deny
            Action:
              - ec2:RunInstances
              - ec2:StartInstances
              - ec2:TerminateInstances
              - ec2:CreateFleet
              - ec2:RequestSpotInstances
              - ec2:RequestSpotFleet
              - autoscaling:CreateAutoScalingGroup
              - autoscaling:UpdateAutoScalingGroup
              - autoscaling:SetDesiredCapacity
            Resource: '*'
          - Sid: NeverTouchOwnBoundary
            Effect: Deny
            Action:
              - iam:DeleteUserPermissionsBoundary
              - iam:PutUserPermissionsBoundary
            Resource: '*'

  # ==========================================================================
  # 2. GROUPS - job functions, built from AWS managed policies only.
  # ==========================================================================

  # Storage job: full S3 (capped by StorageBoundary) and change own password.
  StorageEngineersGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: !Sub onward-${Environment}-storage-engineers
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonS3FullAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/IAMUserChangePassword

  # Compute job: full EC2 (capped by ComputeBoundary) and change own password.
  ComputeEngineersGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: !Sub onward-${Environment}-compute-engineers
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonEC2FullAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/IAMUserChangePassword

  # On-call job: read-only EC2 and change own password. verify-access.sh
  # attaches AdministratorAccess here temporarily to prove the boundary holds.
  OnCallObserversGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: !Sub onward-${Environment}-oncall-observers
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonEC2ReadOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/IAMUserChangePassword

  # ==========================================================================
  # 3. INITIAL CREDENTIALS - generated by Secrets Manager, never typed or
  #    stored in Git. Delivered to the hire out-of-band by an admin.
  # ==========================================================================

  # First-login password for s3-user, stored at onward/<env>/onboarding/s3-user.
  S3UserInitialPassword:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub onward/${Environment}/onboarding/s3-user
      Description: First-login password for s3-user (forced reset on sign-in)
      GenerateSecretString:
        SecretStringTemplate: '{"username":"s3-user"}'
        GenerateStringKey: password
        PasswordLength: 20
        RequireEachIncludedType: true
        ExcludeCharacters: '"@/\''`'

  # First-login password for ec2-user-1, stored at onward/<env>/onboarding/ec2-user-1.
  Ec2User1InitialPassword:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub onward/${Environment}/onboarding/ec2-user-1
      Description: First-login password for ec2-user-1 (forced reset on sign-in)
      GenerateSecretString:
        SecretStringTemplate: '{"username":"ec2-user-1"}'
        GenerateStringKey: password
        PasswordLength: 20
        RequireEachIncludedType: true
        ExcludeCharacters: '"@/\''`'

  # First-login password for ec2-user-2, stored at onward/<env>/onboarding/ec2-user-2.
  Ec2User2InitialPassword:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub onward/${Environment}/onboarding/ec2-user-2
      Description: First-login password for ec2-user-2 (forced reset on sign-in)
      GenerateSecretString:
        SecretStringTemplate: '{"username":"ec2-user-2"}'
        GenerateStringKey: password
        PasswordLength: 20
        RequireEachIncludedType: true
        ExcludeCharacters: '"@/\''`'

  # ==========================================================================
  # 4. USERS - group membership + boundary + forced password reset.
  # ==========================================================================

  # Storage engineer: StorageEngineersGroup, capped by StorageBoundary.
  # S3User:
  #   Type: AWS::IAM::User
  #   Properties:
  #     UserName: s3-user
  #     Groups: [!Ref StorageEngineersGroup]
  #     PermissionsBoundary: !Ref StorageBoundary
  #     LoginProfile:
  #       Password: !Sub '{{resolve:secretsmanager:${S3UserInitialPassword}:SecretString:password}}'
  #       PasswordResetRequired: true
  #     Tags:
  #       - {Key: Role, Value: storage-engineer}

  # Compute engineer: ComputeEngineersGroup, capped by ComputeBoundary.
  Ec2User1:
    Type: AWS::IAM::User
    Properties:
      UserName: ec2-user-1
      Groups: [!Ref ComputeEngineersGroup]
      PermissionsBoundary: !Ref ComputeBoundary
      LoginProfile:
        Password: !Sub '{{resolve:secretsmanager:${Ec2User1InitialPassword}:SecretString:password}}'
        PasswordResetRequired: true
      Tags:
        - {Key: Role, Value: compute-engineer}

  # On-call engineer: OnCallObserversGroup, capped by ObserverBoundary.
  Ec2User2:
    Type: AWS::IAM::User
    Properties:
      UserName: ec2-user-2
      Groups: [!Ref OnCallObserversGroup]
      PermissionsBoundary: !Ref ObserverBoundary
      LoginProfile:
        Password: !Sub '{{resolve:secretsmanager:${Ec2User2InitialPassword}:SecretString:password}}'
        PasswordResetRequired: true
      Tags:
        - {Key: Role, Value: oncall-observer}

  # ==========================================================================
  # 5. AUDIT TRAIL - who changed access, and when. IAM is a global service,
  #    so global service events must be included.
  # ==========================================================================

  # Encrypted, versioned, private bucket for CloudTrail logs. Kept when the
  # stack is deleted, because it is audit evidence.
  AuditBucket:
    Type: AWS::S3::Bucket
    Condition: MakeTrail
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration: {Status: Enabled}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  # Lets only this account's trail write to AuditBucket, and only over HTTPS.
  # Resource-based policy (required by CloudTrail), not an IAM inline policy.
  AuditBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: MakeTrail
    Properties:
      Bucket: !Ref AuditBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudTrailAclCheck
            Effect: Allow
            Principal: {Service: cloudtrail.amazonaws.com}
            Action: s3:GetBucketAcl
            Resource: !GetAtt AuditBucket.Arn
            Condition:
              StringEquals:
                aws:SourceArn: !Sub arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/onward-${Environment}-access-audit
          - Sid: CloudTrailWrite
            Effect: Allow
            Principal: {Service: cloudtrail.amazonaws.com}
            Action: s3:PutObject
            Resource: !Sub '${AuditBucket.Arn}/AWSLogs/${AWS::AccountId}/*'
            Condition:
              StringEquals:
                aws:SourceArn: !Sub arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/onward-${Environment}-access-audit
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt AuditBucket.Arn
              - !Sub '${AuditBucket.Arn}/*'
            Condition:
              Bool: {aws:SecureTransport: 'false'}

  # Multi-Region trail with IAM (global) events and tamper-evident log files.
  # verify-access.sh section 4 reads who changed access from its history.
  AuditTrail:
    Type: AWS::CloudTrail::Trail
    Condition: MakeTrail
    DependsOn: AuditBucketPolicy
    Properties:
      TrailName: !Sub onward-${Environment}-access-audit
      S3BucketName: !Ref AuditBucket
      IsLogging: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true

# ============================================================================
# OUTPUTS - read by verify-access.sh, so the evidence script follows any
# rename made here. Secret outputs are ARNs only, never password values.
# ============================================================================
Outputs:
  Environment:
    Description: Environment prefix used in every resource name.
    Value: !Ref Environment
  ConsoleSignInUrl:
    Description: Where new engineers sign in for the first time.
    Value: !Sub https://${AWS::AccountId}.signin.aws.amazon.com/console

  S3UserName:
    Description: Storage engineer user.
    Value: !Ref S3User
  Ec2User1Name:
    Description: Compute engineer user.
    Value: !Ref Ec2User1
  Ec2User2Name:
    Description: On-call (observe-only) engineer user.
    Value: !Ref Ec2User2

  StorageEngineersGroupName:
    Description: Group for storage engineers.
    Value: !Ref StorageEngineersGroup
  ComputeEngineersGroupName:
    Description: Group for compute engineers.
    Value: !Ref ComputeEngineersGroup
  OnCallObserversGroupName:
    Description: Group for on-call engineers (used by the stress test).
    Value: !Ref OnCallObserversGroup

  StorageBoundaryArn:
    Description: Boundary expected on s3-user.
    Value: !Ref StorageBoundary
  ComputeBoundaryArn:
    Description: Boundary expected on ec2-user-1.
    Value: !Ref ComputeBoundary
  ObserverBoundaryArn:
    Description: Boundary expected on ec2-user-2.
    Value: !Ref ObserverBoundary

  S3UserSecretArn:
    Description: Secret holding s3-user's first-login password.
    Value: !Ref S3UserInitialPassword
  Ec2User1SecretArn:
    Description: Secret holding ec2-user-1's first-login password.
    Value: !Ref Ec2User1InitialPassword
  Ec2User2SecretArn:
    Description: Secret holding ec2-user-2's first-login password.
    Value: !Ref Ec2User2InitialPassword

  AuditTrailName:
    Condition: MakeTrail
    Description: CloudTrail trail recording every access change.
    Value: !Ref AuditTrail
  AuditBucketName:
    Condition: MakeTrail
    Description: Bucket holding the CloudTrail log files.
    Value: !Ref AuditBucket
